[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-sim"
version = "0.1.0"
description = "Simulated options market-making engine: pricing, quoting, order flow, hedging, risk limits, and P&L attribution."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
